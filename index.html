<style>html,body{margin:0;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;height:100%;background:#111;overflow:hidden;touch-action:none}
#wrap{position:absolute;inset:0;display:flex;justify-content:center;align-items:center}
canvas{display:block;box-shadow:0 0 30px rgba(0,0,0,.6)}
#sa{position:absolute;top:0;left:0;width:0;height:env(safe-area-inset-top,0px);pointer-events:none}
#bgmBtn{position:absolute;left:8px;top:calc(env(safe-area-inset-top,0px) + 8px);width:34px;height:34px;border-radius:17px;

#dlg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:9;-webkit-user-select:text;user-select:text}

#dlgT{color:#fff;font-size:16px;font-weight:bold;margin-bottom:12px}
#dlgI{width:100%;box-sizing:border-box;font-size:18px;padding:10px;border-radius:10px;border:1px solid #868e96;background:#1c1d2b;color:#fff;outline:none}
#dlg .row{display:flex;gap:10px;margin-top:14px}#dlg button{flex:1;font-size:16px;padding:10px;border:0;border-radius:10px;color:#fff;font-weight:bold}
#dlgOk{background:#1c7ed6}#dlgNo{background:#495057}</style></head>
